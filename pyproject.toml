[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["test"]
pythonpath = ["src"]
markers = [
  "grad: Marks tests which perform 'gradcheck' evaluations, this can be slow.",
  "large: Marks tests for large molecules, this can be slow.",
]
filterwarnings = [
  # emitted by torch's own compile stack on Python 3.14, not by our code
  "ignore:`torch.jit.script(_method)?` is not supported in Python 3.14:DeprecationWarning",
]


[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
exclude = '''(?x)
  ^src/tad_mctc/autograd/gradcheck\.py$
  | ^src/tad_mctc/data/structures/
  | ^src/tad_mctc/typing/
  | ^src/tad_mctc/units/
  | ^test/conftest.py$
  | ^build/
  | ^dist/
  | ^setup.py$
  | ^tools/refs/_build_fpm/
  | ^tools/refs/_install_fpm/
  | ^tools/refs/_build_meson/
  | ^tools/refs/_install_meson/
  | ^tools/refs/subprojects/
'''

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "triton.*"
ignore_missing_imports = true


[tool.pyright]
extraPaths = ["src"]
include = ["src", "test", "tools"]
exclude = [
  "**/__pycache__",
  "**/node_modules",
  "**/.venv*",
  "**/.*",
  "src/tad_mctc/autograd/gradcheck.py",
  "src/tad_mctc/data/structures",
  "src/tad_mctc/typing",
  "src/tad_mctc/units",
  "test/conftest.py",
  "examples",
  "build",
  "dist",
  "setup.py",
  "tools/refs/_build_fpm",
  "tools/refs/_install_fpm",
  "tools/refs/_build_meson",
  "tools/refs/_install_meson",
  "tools/refs/subprojects",
]
reportPrivateImportUsage = false


[tool.coverage.run]
plugins = ["covdefaults"]
source = ["./src"]
omit = [
  "./src/tad_mctc/autograd/gradcheck.py",
  "./src/tad_mctc/data/structures/*",
  "./src/tad_mctc/typing/*",
  "./src/tad_mctc/units/*",
]

[tool.coverage.paths]
source = [
  "src/tad_mctc",
  "*/site-packages/tad_mctc",
]

[tool.coverage.report]
fail_under = 90
